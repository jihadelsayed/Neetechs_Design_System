name: Publish Neetechs UI to npm

# Pushes to main run the full verification gate only.
# Publishing to npm requires an explicit manual run with `publish: true`
# (Actions → "Publish Neetechs UI to npm" → Run workflow) by the package owner.
on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the release to npm (owner approval required)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: neetechs-ui-npm-release
  cancel-in-progress: false

jobs:
  release:
    name: Verify and (optionally) publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"
          package-manager-cache: false

      - name: Update npm
        run: npm install --global npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Run static contracts, build, and unit tests
        run: npm test

      - name: Install accessibility browser
        run: npx playwright install --with-deps chromium

      - name: Run browser accessibility, responsive, and visual tests
        run: npx playwright test

      - name: Verify package contents and consumer install
        run: npm run check:package

      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.publish == true
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
